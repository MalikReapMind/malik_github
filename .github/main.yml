name: Flutter CI/CD

on:
  push:
    branches:
      - dev
      - feature-*
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'

      # 3. Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 4. Analyze code
      - name: Analyze project
        run: flutter analyze

      # 5. Run tests
      - name: Run tests
        run: flutter test

      # 6. Build APK
      - name: Build APK
        run: flutter build apk

      # 7. Upload APK (Download from GitHub)
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk